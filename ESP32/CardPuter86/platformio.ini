; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = CardPuter86/

[env:cardputer86]
platform = espressif32@~6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 at 240MHz
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_cardputer86.csv
board_build.filesystem = fatfs

build_type = release
; PlatformIO appends the build_type's -Os AFTER build_flags, and the last -O
; flag wins, so -O2 above was silently overridden. Unflag it (N2-①).
build_unflags =
    -Os
upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200

; Extra esptool args: no-compress, reset after upload
upload_flags =
    --before=default_reset
    --after=hard_reset

build_flags =
    -w
    -s -O2
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; Exclude original PS/2 keyboard driver files (replaced by cardputer_kbd)
build_src_filter =
    +<*>
    -<PS2Kbd.cpp>
    -<PS2KeyAdvanced.cpp>
    -<vga_6bit.cpp>

lib_deps =
    m5stack/M5Cardputer@^1.0.2

[env:cardputer86-dbg]
extends = env:cardputer86
build_unflags =
    -Os
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    -w
    -s -O2
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Duse_lib_log_serial=1

; ---------------------------------------------------------------------------
; 出货构建：**带 WiFi/COM1 调制解调器**（cardputer_modem.cpp 编进来）
;   pio run -e cardputer86-lean
; 必须用 --flash-mode dio 刷入（M5 机器 QIO 起不来）
;
; 要回到「无 WiFi」的精简固件（省 ~390KB Flash、~25KB 静态 RAM）：
;     build_flags 里加      -DCARDPUTER86_NO_MODEM=1
;     build_src_filter 里把 +<cardputer_modem.cpp> 改回 -<cardputer_modem.cpp>
; ---------------------------------------------------------------------------
[env:cardputer86-lean]
extends = env:cardputer86
build_flags =
    ${env:cardputer86.build_flags}
    -DG86_CACHE_PAGES_MAX=56
build_src_filter =
    ${env:cardputer86.build_src_filter}
    +<cardputer_modem.cpp>

; ---------------------------------------------------------------------------
; 诊断专用：不刷机，只让 GCC 把被 -w 压住的"栈缓冲区越界"类警告吐出来
;   pio run -e cardputer86-warn
; 用途：-O2 会把潜伏的定长局部数组溢出从"溢进填充区"变成"踩中栈探针"，
; 本 env 用 -Warray-bounds=2 / -Wstringop-overflow=2 / -Wformat-overflow=2
; 静态找出这些点。
; ---------------------------------------------------------------------------
[env:cardputer86-warn]
extends = env:cardputer86-lean
build_unflags =
    -Os
    -w
build_flags =
    -s -O2
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; TEMP-WIFI-MEASURE
    -DG86_CACHE_PAGES_MAX=56
    -Wall
    -Warray-bounds=2
    -Wstringop-overflow=2
    -Wformat-overflow=2
    -Wformat-truncation=2
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wno-unused-function
    -Wno-sign-compare
    -Wno-unused-parameter

[env:cardputer86-dbglean]
extends = env:cardputer86-lean
build_unflags =
    -Os
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    -w
    -s -O2
    ; 4 = DEBUG: the SD/FatFS driver reports card-init failures through the
    ; Arduino log_*() macros, which are compiled out at the default level 0.
    -DCORE_DEBUG_LEVEL=4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Duse_lib_log_serial=1
    -DG86_CACHE_PAGES_MAX=56
; dbglean 常开 WiFi modem：串口日志 + COM1/AT 调试命令都能用，
; 是验证 WiFi 路径的调试固件（guest 页缓存因此掉到 24 页，比 lean 慢）。
; 要纯调试、不要 WiFi，把下面 build_src_filter 里的 + 改回 - 并加回
; -DCARDPUTER86_NO_MODEM=1（注意：BT 键盘也在 dbglean 里，BLE + modem 同时开
; 时 Flash 到 99.6%，只剩 9KB 余量）。
build_src_filter =
    ${env:cardputer86-lean.build_src_filter}
    +<cardputer_modem.cpp>

; ---------------------------------------------------------------------------
; ❌ 不要用这个 env：沙箱内 `pio run -e cardputer86-net` 会永久挂住（9 分钟零输出、
;    连 .pio/build/cardputer86-net 都不创建），因为新 env 需要联网解析 platform 包。
;    要做 WiFi 变体请改 [env:cardputer86-lean] 的两行 flag（见上面的说明）。
;    本段仅作为记录保留。
; ---------------------------------------------------------------------------
[env:cardputer86-net]
extends = env:cardputer86-lean
build_flags =
    ${env:cardputer86.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Duse_lib_log_serial=1
    -DG86_CACHE_PAGES_MAX=56
build_src_filter =
    ${env:cardputer86-lean.build_src_filter}
    +<cardputer_modem.cpp>
